const $=(q,root=document)=>root.querySelector(q);

const monthFrom=(key,shift)=>{const [y,m]=key.split('-').map(Number);let d=new Date(y,m-1+shift,1);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`};
const monthLabel=key=>new Date(key+'-01T12:00:00').toLocaleDateString('en-CA',{month:'long',year:'numeric'});
const dateLabel=iso=>new Date(iso+'T12:00:00').toLocaleDateString('en-CA',{month:'short',day:'numeric'});
const abbrMoney=amount=>{const n=Math.abs(num(amount));return (amount<0?'-':'')+(n>=10000?Math.round(n/1000)+'k':n>=1000?(n/1000).toFixed(1)+'k':Math.round(n).toString())};

const key='SAVE_APP_LOCAL_V1';
function fresh(){return {version:1,onboarded:false,profile:{name:'',ageGroup:'',gender:'',currency:'CAD'},budget:1600,categoryBudgets:{...defaultsBudgets},transactions:[],items:defaultItems.map(a=>({...a})),featured:'phone',benchmark:{amount:0,label:'',source:''},createdAt:new Date().toISOString(),demo:false}}

function drawTopbar(){const user=s.profile.name?.trim()?`<strong>${esc(s.profile.name)}</strong>`:'<strong>your space</strong>';$('#topbar').innerHTML=`<div class="top-left"><div class="top-hello">✳ &nbsp; Welcome to ${user}</div></div><div class="top-actions"><div class="monthpick"><button aria-label="Previous month" data-action="prevMonth">${ico('left',15)}</button><span class="monthname">${esc(new Date(ui.month+'-01T12:00:00').toLocaleDateString('en-CA',{month:'short',year:'numeric'}))}</span><button aria-label="Next month" data-action="nextMonth" ${ui.month>=nowmonth()?'disabled':''}>${ico('right',15)}</button></div><button class="icon-btn" data-action="nav" data-view="settings" aria-label="Settings">${ico('settings',17)}</button><button class="button primary" data-action="add">${ico('plus',16)}<span> Add record</span></button></div>`;}
function render(){drawSidebar();drawTopbar();const pages={dashboard:renderDashboard,activity:renderActivity,insights:renderInsights,compare:renderCompare,goals:renderGoals,settings:renderSettings};$('#app').innerHTML=`<div class="view">${(pages[ui.view]||renderDashboard)()}</div>`;if(!s.onboarded&&!$('#modalRoot').innerHTML.trim())openOnboard();}
function miniTransactions(items,withTools=false){return items.sort((a,b)=>b.date.localeCompare(a.date)).map(t=>`<div class="tx-row"><div class="tx-icon" aria-hidden="true">${t.type==='income'?'↙':t.type==='saving'?'✦':cat(t.category).icon}</div><div style="min-width:0"><div class="tx-title">${esc(t.merchant||t.category)}</div><div class="tx-sub">${dateLabel(t.date)} · ${esc(t.category)} ${t.recurring?'· Recurring':''}</div></div><div class="tx-amt ${t.type}">${t.type==='expense'?'−':t.type==='income'?'+':'↗ '}${cash(t.amount)}</div></div>`).join('')}
function donut(categoriesList,total){if(!total)return `<div class="donutwrap"><div class="donut"><div class="donutinner"><strong>—</strong><span>No spending</span></div></div><div class="empty-mini">Add a few expenses to see your spending split by category.</div></div>`;let start=0;const stops=[];categoriesList.forEach(([name,amt])=>{let end=start+amt/total*100;stops.push(`${cat(name).color} ${start.toFixed(2)}% ${end.toFixed(2)}%`);start=end});let first=categoriesList.slice(0,4);let rest=categoriesList.slice(4).reduce((a,e)=>a+e[1],0);if(rest)first.push(['Other categories',rest]);return `<div class="donutwrap"><div class="donut" style="background:conic-gradient(${stops.join(',')})"><div class="donutinner"><strong>${categoriesList.length}</strong><span>categories</span></div></div><div class="legend">${first.map(([name,amt])=>`<div class="legendrow"><i class="color-dot" style="background:${name==='Other categories'?'#d7c4cd':cat(name).color}"></i><span>${esc(name)}</span><b>${Math.round(amt/total*100)}%</b></div>`).join('')}</div></div>`}
function monthTrend(){const months=Array.from({length:6},(_,i)=>monthFrom(ui.month,i-5));const nums=months.map(m=>totals(m).spent);const high=Math.max(1,...nums);return `<div class="between"><div><h3 class="section-title">Monthly rhythm</h3><p class="subtle" style="margin:5px 0 0">A picture of your last six months</p></div><span class="pill">Spending</span></div><div class="trend-bars">${months.map((m,i)=>{const active=m===ui.month,h=nums[i]?Math.max(nums[i]/high*100,3):2;return `<div class="trend-slot ${active?'highlight':''}" title="${esc(monthLabel(m))}: ${cash(nums[i])}"><div class="trend-col ${active?'highlight':''}" style="height:${h}%">${active&&nums[i]?`<div class="trend-value">${cash(nums[i])}</div>`:''}</div><label>${new Date(m+'-01T12:00:00').toLocaleDateString('en-CA',{month:'short'})}</label></div>`}).join('')}</div><div class="between" style="margin-top:18px"><span class="subtle">${nums.filter(n=>n>0).length?`${nums.filter(n=>n>0).length} months with recorded expenses`:'Start recording to build your history'}</span>${btn('Full ledger '+ico('arrow',12),'navActivity','ghost mini')}</div>`;}
function adviceData(){const expenses=monthExpenses();const total=totals().spent;const groups=catTotals();const complete=expenses.length>=6&&groups.length>=2;const best=[],reduce=[],keep=[],offers=[];
if(!complete)return {complete,count:expenses.length,groups:groups.length,best,reduce,keep,offers};
const saving=totals().saved;const budget=s.budget;
if(saving>0)best.push({title:'You set money aside',detail:`You recorded ${cash(saving)} in savings transfers this month. Keeping it visible is a strong habit.`});
if(total<=budget)best.push({title:'Still within your spending limit',detail:`You've recorded ${cash(total)} against a ${cash(budget)} budget — ${cash(Math.max(0,budget-total))} remains.`});
const under=groups.filter(([k,v])=>num(s.categoryBudgets[k])>0&&v<=s.categoryBudgets[k]);if(under.length>=2)best.push({title:'Several categories are staying on track',detail:`${under.slice(0,3).map(([c])=>c).join(', ')} are under their category limits.`});
if(best.length===0)best.push({title:'You are tracking the details',detail:`You've logged ${expenses.length} expenses across ${groups.length} categories. That gives you a useful starting picture.`});
const sortedOver=groups.filter(([k,v])=>num(s.categoryBudgets[k])>0&&v>s.categoryBudgets[k]).sort((a,b)=>(b[1]-s.categoryBudgets[b[0]])-(a[1]-s.categoryBudgets[a[0]]));sortedOver.slice(0,2).forEach(([k,v])=>reduce.push({title:`Review ${k.toLowerCase()} spending`,detail:`${cash(v)} spent against a ${cash(s.categoryBudgets[k])} category limit (${cash(v-s.categoryBudgets[k])} above). Check which purchases were optional.`}));
if(reduce.length<2&&groups.length){let choice=groups.find(([c])=>['Food & drink','Subscriptions','Shopping','Entertainment','Other'].includes(c));if(choice)reduce.push({title:`Look for flexibility in ${choice[0].toLowerCase()}`,detail:`${cash(choice[1])} recorded. Try reducing one optional expense rather than cutting essentials.`});}
const countByMerchant={};expenses.forEach(t=>{const m=(t.merchant||'').toLowerCase().trim();if(m)countByMerchant[m]=(countByMerchant[m]||0)+1});const repeated=Object.entries(countByMerchant).filter(([m,n])=>n>=3).sort((a,b)=>b[1]-a[1]);if(repeated.length)reduce.push({title:'A repeat purchase adds up',detail:`“${repeated[0][0]}” appears ${repeated[0][1]} times this month. Decide whether every visit was worth it.`});
const essentials=groups.filter(([k])=>['Groceries','Transport','Health','Education','Housing'].includes(k));if(essentials.length)keep.push({title:'Protect your essentials',detail:`Keep realistic room for ${essentials.slice(0,3).map(([c])=>c.toLowerCase()).join(', ')} before making cuts.`});
if(saving)keep.push({title:'Keep setting aside what you can',detail:'Small, consistent transfers often feel more sustainable than an aggressive one-time target.'});
if(groups.some(([k])=>k==='Subscriptions'))offers.push({title:'Audit recurring plans',detail:'Check provider pricing for student, annual, or shared plans where eligible. Compare the total cost before changing.'});
if(groups.some(([k])=>k==='Food & drink'))offers.push({title:'Swap one takeaway for a homemade option',detail:'Use the price difference from your own receipts to set a realistic weekly target.'});
if(groups.some(([k])=>k==='Shopping'))offers.push({title:'Use a 48-hour wishlist',detail:'Keep optional purchases in a list for two days; compare sale prices only for items you still want.'});
if(groups.some(([k])=>k==='Transport'))offers.push({title:'Compare your transit options',detail:'Check whether a pass, individual fares, or an eligible student discount works out cheapest for your trips.'});
if(groups.some(([k])=>k==='Groceries'))offers.push({title:'Plan around what is already at home',detail:'Make a grocery list from meals and existing ingredients to reduce duplicate purchases.'});
if(!offers.length)offers.push({title:'Compare like-for-like prices',detail:'For your most frequent optional purchase, compare unit prices before switching providers.'});
return {complete,count:expenses.length,groups:groups.length,best,reduce,keep,offers};}
function nudge(){const advice=adviceData();if(!advice.complete)return {title:'The first step is seeing it.',text:'Record at least six expenses across two categories to unlock meaningful insights. No made-up recommendations.'};let top=advice.reduce[0]||advice.offers[0];return {title:top.title,text:top.detail};}
function budgetStrip(){const total=totals().spent;const pct=cap(total/Math.max(1,s.budget)*100,0,100);return `<div style="margin-top:19px"><div class="between text-small" style="margin-bottom:10px"><b>Monthly spending limit</b><span class="muted">${cash(total)} / ${cash(s.budget)}</span></div><div class="progress-track"><div class="progress-fill ${total>s.budget?'warn':''}" style="width:${pct}%"></div></div><div class="between" style="margin-top:8px"><span class="smallprint">${Math.round(total/s.budget*100)}% used</span><span class="smallprint">${total<=s.budget?cash(s.budget-total)+' to go':cash(total-s.budget)+' over limit'}</span></div></div>`;}
function renderDashboard(){const t=totals(),cats=catTotals(),n=nudge(),savings=aggregateSaved();const item=s.items.find(x=>x.id===s.featured)||s.items[0],available=Math.max(0,s.budget-t.spent);return `${viewHead(`Your money, in focus.`, `A clearer picture of ${monthLabel(ui.month).toLowerCase()}. Every little choice counts.`,btn(`${ico('plus',15)} Add a transaction`,'add','ghost'))}
<div class="grid2"><div><section class="hero"><div class="hero-top"><i class="dot"></i> PERSONAL SPENDING · ${esc(monthLabel(ui.month).toUpperCase())}</div><div class="hero-total">${cash(t.spent)}</div><div class="hero-caption">spent this month</div><div class="hero-footer"><span class="hero-pill">${ico('wallet',13)} &nbsp; ${cash(available)} budget remaining</span><span class="hero-pill">${t.count} expenses logged</span></div><div class="hero-scribble">${ico('sparkle',38,1)}</div><span class="hero-star">✧</span></section><div class="kpi-grid"><div class="kpi"><div class="meta"><i>${ico('income',14)}</i> Money in</div><strong class="positive">${cash(t.income)}</strong><small>Recorded income</small></div><div class="kpi"><div class="meta"><i>${ico('outgoing',14)}</i> Left to spend</div><strong class="${available===0?'negative':''}">${cash(available)}</strong><small>Of monthly limit</small></div><div class="kpi"><div class="meta"><i>${ico('goals',14)}</i> Set aside</div><strong>${cash(t.saved)}</strong><small>Savings transfers</small></div></div></div>
${pane(`${sectionHead('Where it all went',`<span class="pill">${cats.length} categories</span>`)}${donut(cats,t.spent)}${budgetStrip()}`)}</div>
<div class="grid2 topgap"><div>${pane(monthTrend())}</div><div>${pane(`${sectionHead('Your latest entries',btn('View all '+ico('arrow',12),'navActivity','ghost mini'))}${trans().length?`<div class="transactions">${miniTransactions([...trans()].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5))}</div>`:empty(ico('activity',27),'Nothing recorded yet.','Add your first expense, income, or transfer to savings.',btn('Add a record','add','primary mini'))}`)}</div></div>
<div class="grid2 topgap"><div><div class="tip-card"><div class="tip-icon">${ico('sparkle',22)}</div><div><div class="eyebrow" style="margin:0 0 6px">A LITTLE SOMETHING TO THINK ABOUT</div><h3>${esc(n.title)}</h3><p>${esc(n.text)}</p>${btn('Explore your analysis '+ico('arrow',13),'navInsights','soft mini')}</div></div></div><div>${pane(`${sectionHead('What your savings could buy',btn('Explore rewards '+ico('arrow',12),'navGoals','ghost mini'))}<div class="savings-item"><div class="product-emoji">${esc(item.emoji)}</div><div style="flex:1;min-width:0"><h4>${esc(item.name)}</h4><p>${cash(item.price)} · example price, editable</p><div class="product-progress"><i style="width:${cap(savings/Math.max(item.price,1)*100,0,100)}%"></i></div><div class="between" style="margin-top:7px"><span class="smallprint">${cash(savings)} saved</span><strong style="font-size:11px">${Math.floor(savings/Math.max(item.price,1))} whole items</strong></div></div></div>`)}</div></div>`;}
function renderActivity(){const rows=activityFiltered();const total=rows.reduce((sum,t)=>sum+t.amount*(t.type==='expense'?-1:t.type==='income'?1:0),0);return `${viewHead('Every little detail.',`A clear record of every purchase, payment, and savings transfer.`,btn(`${ico('plus',16)} New entry`,'add','primary'))}
<div class="grid3"><div class="glass pane"><div class="eyebrow">Expense entries</div><div style="font-family:Manrope,'DM Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:30px;font-weight:800;letter-spacing:-1px">${monthExpenses().length}</div><div class="smallprint">in ${monthLabel(ui.month)}</div></div><div class="glass pane"><div class="eyebrow">Spent</div><div style="font-family:Manrope,'DM Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:30px;font-weight:800;letter-spacing:-1px">${cash(totals().spent)}</div><div class="smallprint">money leaving your wallet</div></div><div class="glass pane"><div class="eyebrow">Moved to savings</div><div style="font-family:Manrope,'DM Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:30px;font-weight:800;letter-spacing:-1px">${cash(totals().saved)}</div><div class="smallprint">transfers recorded</div></div></div>
${pane(`<div class="between wrap sectiontop"><h3 class="section-title">Your ledger <span class="pill">${rows.length} entries</span></h3><div class="between gap8 wrap">${btn(`${ico('upload',13)} Import CSV`,'importCsv','ghost mini')}${btn(`${ico('down',13)} Export CSV`,'exportCsv','ghost mini')}</div></div>
<div class="filters"><label class="searchbar">${ico('search',16)}<input id="txSearch" placeholder="Search merchant or notes" value="${esc(ui.search)}" aria-label="Search transactions"></label><select class="selectbox" id="txType" aria-label="Filter type"><option value="all" ${ui.filter==='all'?'selected':''}>All records</option><option value="expense" ${ui.filter==='expense'?'selected':''}>Expenses</option><option value="income" ${ui.filter==='income'?'selected':''}>Income</option><option value="saving" ${ui.filter==='saving'?'selected':''}>Saved</option></select><select class="selectbox" id="txCategory" aria-label="Filter category"><option value="all">All categories</option>${categories.map(c=>`<option ${ui.category===c.id?'selected':''} value="${esc(c.id)}">${esc(c.id)}</option>`).join('')}</select></div><div id="ledgerRows">${renderLedgerTable(rows)}</div>`,'topgap')}
<div class="note-box topgap">${ico('shield',16)} &nbsp; All records are stored locally in this browser. Export a backup if you change devices, clear browser data, or want an extra copy.</div>`;}
function activityFiltered(){return trans().filter(t=>(ui.filter==='all'||t.type===ui.filter)&&(ui.category==='all'||t.category===ui.category)&&(!ui.search||[t.merchant,t.category,t.note,t.type].join(' ').toLowerCase().includes(ui.search.toLowerCase()))).sort((a,b)=>b.date.localeCompare(a.date));}
function renderLedgerTable(rows){if(!rows.length)return empty(ico('search',28),'No matching entries.','Change your filters, or add a new record to get started.',btn('Add a record','add','primary mini'));return `<div class="table-overflow"><table class="data-table"><thead><tr><th>Date</th><th>Merchant / description</th><th>Category</th><th>Type</th><th>Amount</th><th></th></tr></thead><tbody>${rows.map(t=>`<tr><td>${dateLabel(t.date)}</td><td><strong>${esc(t.merchant||t.category)}</strong>${t.note?`<div class="smallprint" style="margin-top:4px;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(t.note)}</div>`:''}</td><td><span class="category-tag">${esc(t.category)}</span></td><td><span style="text-transform:capitalize;color:#877689">${esc(t.type==='saving'?'Saved':t.type)}</span>${t.recurring?' <span title="Recurring">↻</span>':''}</td><td><strong style="color:${t.type==='income'?'#72987c':t.type==='saving'?'#9c74a1':'#473246'}">${t.type==='expense'?'−':t.type==='income'?'+':'↗ '}${cash(t.amount)}</strong></td><td><div style="display:flex;justify-content:end;gap:4px"><button class="tx-action" title="Edit" data-action="edit" data-id="${esc(t.id)}">${ico('pencil',15)}</button><button class="tx-action" title="Delete" data-action="delete" data-id="${esc(t.id)}">${ico('trash',15)}</button></div></td></tr>`).join('')}</tbody></table></div>`;}
function insightBlock(items,kind){if(!items.length)return '<p class="subtle">Nothing to highlight here yet.</p>';return items.slice(0,3).map(x=>`<div class="advice"><div class="advice-num">${ico(kind==='good'?'check':kind==='reduce'?'trending':'leaf',15)}</div><div><strong>${esc(x.title)}</strong><p>${esc(x.detail)}</p></div></div>`).join('')}
function renderInsights(){const ad=adviceData(),t=totals();return `${viewHead('A little insight goes a long way.',`Practical suggestions based on your actual entries — no judgment, no guessing.`,btn(`${ico('sparkle',16)} Ask ChatGPT`,'openAi','primary'))}
${!ad.complete?pane(empty(ico('sparkle',30),'Not enough data yet.',`You have ${ad.count} expense record${ad.count===1?'':'s'} across ${ad.groups} categor${ad.groups===1?'y':'ies'} in ${monthLabel(ui.month)}. Add at least six expenses spanning two categories for a meaningful local analysis.`,btn('Add your next expense','add','primary'))):`<div class="grid2equal"><div>${pane(`${sectionHead(`<span style="color:#739a7a">✓</span> What you did well`)}<div class="insight-list">${insightBlock(ad.best,'good')}</div>`)}</div><div>${pane(`${sectionHead(`<span style="color:#d47e70">↘</span> What you could reduce`)}<div class="insight-list">${insightBlock(ad.reduce,'reduce')}</div>`)}</div></div><div class="grid2equal topgap"><div>${pane(`${sectionHead(`<span style="color:#9b82a1">✳</span> What you can keep`)}<div class="insight-list">${insightBlock(ad.keep,'good')}</div>`)}</div><div>${pane(`${sectionHead(`<span style="color:#c69266">✦</span> Cheaper ways to do it`)}<div class="insight-list">${insightBlock(ad.offers,'reduce')}</div>`)}</div></div>`}
<div class="grid2 topgap"><div>${pane(`${sectionHead('Monthly categories',`<span class="pill">Your limits</span>`)}${categories.filter(c=>num(s.categoryBudgets[c.id])>0).map(c=>{const amount=(catTotals().find(e=>e[0]===c.id)||[])[1]||0;const max=s.categoryBudgets[c.id];return `<div style="margin:16px 0"><div class="between" style="margin-bottom:7px"><span style="font-size:11px;font-weight:700">${c.icon} &nbsp; ${esc(c.id)}</span><span class="smallprint">${cash(amount)} <span class="muted">/ ${cash(max)}</span></span></div><div class="progress-track" style="height:6px"><div class="progress-fill ${amount>max?'warn':''}" style="width:${cap(amount/max*100,0,100)}%;background:${amount>max?'linear-gradient(90deg,#e7a48a,#d76c67)':c.color}"></div></div></div>`}).join('')}${btn('Adjust category limits '+ico('arrow',12),'navSettings','ghost mini')}`)}</div><div><div class="tip-card"><div class="tip-icon">${ico('chat',22)}</div><div><div class="eyebrow" style="margin:0 0 6px">OPTIONAL SECOND OPINION</div><h3>Get deeper suggestions from ChatGPT.</h3><p>Review a spending summary before copying it to ChatGPT. Merchant names are excluded unless you choose to include them. No automatic connection or data transfer.</p>${btn('Prepare my analysis '+ico('arrow',12),'openAi','primary mini')}</div></div><div class="note-box topgap">${ico('info',16)} These suggestions are rule-based. SAVE. does not automatically find or verify live subscription prices or compare providers. Check current terms and any eligibility requirements before switching.</div></div></div>`;}
function renderCompare(){const t=totals(),last=totals(monthFrom(ui.month,-1));const bench=num(s.benchmark.amount);const ref=bench||0;const range=Math.max(t.spent,ref,1)*1.2;let rel=ref?((t.spent-ref)/ref)*100:0;return `${viewHead('Compare with context.',`Use your past spending or an evidence-based reference. No fictional “average person”.`)}

];if(includeMerchant){lines.push('','OPTIONAL MERCHANT DETAILS (user chose to include):');trans().filter(x=>x.type==='expense').forEach(x=>lines.push(`- ${x.date}: ${x.merchant||x.category}, ${cash(x.amount)} (${x.category})`));}return lines.join('\n');}

function fileDownload(filename,text,mime='text/plain'){const blob=new Blob([text],{type:mime}),url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2500);}

function csvEscape(v){let str=String(v??'');if(/^[=+@\-\t\r]/.test(str)&&!/^\d{4}-\d{2}-\d{2}$/.test(str))str="'"+str;return '"'+str.replace(/"/g,'""')+'"'}
function exportCsv(){const names=['date','type','category','merchant','amount','recurring','note'];const csv=[names.join(','),...s.transactions.map(t=>names.map(k=>csvEscape(k==='recurring'?(t[k]?'true':'false'):t[k])).join(','))].join('\r\n');fileDownload(`SAVE-transactions-${tday()}.csv`,csv,'text/csv;charset=utf-8');toast('Transaction CSV exported.')}
function parseCSV(str){const out=[];let row=[],cur='',quote=false;for(let i=0;i<str.length;i++){const c=str[i];if(quote){if(c==='"'&&str[i+1]==='"'){cur+='"';i++}else if(c==='"'){quote=false}else cur+=c;}else if(c==='"')quote=true;else if(c===','){row.push(cur);cur=''}else if(c==='\n'){row.push(cur.replace(/\r$/,''));out.push(row);row=[];cur=''}else cur+=c;}if(cur||row.length){row.push(cur.replace(/\r$/,''));out.push(row)}return out}
function importCsvText(raw){const rows=parseCSV(raw.replace(/^\uFEFF/,''));if(rows.length<2)throw new Error('CSV has no data rows.');const heads=rows.shift().map(h=>h.toLowerCase().trim());for(const needed of ['date','type','category','amount'])if(!heads.includes(needed))throw new Error(`Missing CSV column: ${needed}`);const idx=name=>heads.indexOf(name);const safe=(r,n)=>idx(n)<0?'':(r[idx(n)]||'').trim();let added=0,skipped=0;const imported=[];
for(const r of rows){if(!r.some(x=>x.trim()))continue;const date=safe(r,'date'),type=safe(r,'type'),category=safe(r,'category'),amount=Number(safe(r,'amount'));if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||!['expense','income','saving'].includes(type)||!Number.isFinite(amount)||amount<=0||amount>100000000){skipped++;continue;}const validCat=type==='expense'?categories.some(c=>c.id===category):true;imported.push({id:uid(),date,type,category:type==='expense'?(validCat?category:'Other'):type==='income'?'Income':'Savings',merchant:safe(r,'merchant').slice(0,90),amount,recurring:/^(true|1|yes)$/i.test(safe(r,'recurring')),note:safe(r,'note').slice(0,400)});added++;}s.transactions.push(...imported);s.onboarded=true;persist();render();toast(`Imported ${added} records${skipped?` (${skipped} rows skipped)`:''}.`)}
function filePicker(accept,cb){let input=document.createElement('input');input.type='file';input.accept=accept;input.style.display='none';document.body.appendChild(input);input.addEventListener('change',async()=>{try{if(input.files?.[0])await cb(await input.files[0].text())}catch(err){toast('Import failed: '+err.message)}finally{input.remove()}});input.click();}
async function copyText(text){try{await navigator.clipboard.writeText(text);return true}catch(e){const el=document.createElement('textarea');el.value=text;el.style.cssText='position:fixed;top:4px;left:4px;opacity:.01;z-index:999';document.body.appendChild(el);el.select();let copied=false;try{copied=document.execCommand('copy')}catch(e){}el.remove();return copied}}

case 'delete':{let t=s.transactions.find(v=>v.id===id);if(t&&confirm(`Delete ${t.merchant||t.category} (${cash(t.amount)})?`)){s.transactions=s.transactions.filter(v=>v.id!==id);persist();render();toast('Record deleted.')}break;}
case 'close':closeModal();break;
case 'setType':{$('#txFormType').value=node.dataset.type;$$('#typeTabs button').forEach(b=>b.classList.toggle('active',b.dataset.type===node.dataset.type));$('#fCategory').innerHTML=categoryOptions(node.dataset.type);break;}
case 'onboardStart':beginFresh();break;
case 'onboardDemo':s.profile.name=($('#onName')?.value||'').trim().slice(0,35);s.profile.currency=$('#onCurrency')?.value||'CAD';s.budget=validMoney($('#onBudget')?.value)||1600;beginDemo();break;
case 'openAi':openAi();break;
case 'copyPrompt':{let p=makeAiPrompt(ui.aiMerchant);if(!p){toast('Not enough data for tailored analysis.');break;}let ok=await copyText(p);toast(ok?'Spending summary copied.':'Copy blocked — select the summary text manually.');break;}
case 'copyAndOpen':{const prompt=makeAiPrompt(ui.aiMerchant);if(!prompt){toast('Not enough data for tailored analysis.');break;}const tab=window.open('https://chatgpt.com/','_blank','noopener,noreferrer');const okay=await copyText(prompt);toast(okay?'Summary copied. Paste it into ChatGPT when ready.':'Select and copy your summary before pasting it into ChatGPT.');if(!tab)toast('If ChatGPT did not open, allow pop-ups or open chatgpt.com yourself.');break;}
case 'editBenchmark':openBenchmark();break;
case 'editPrice':openPrice(id);break;
case 'newItem':openNewItem();break;
case 'removeItem':{let item=s.items.find(v=>v.id===id);if(item?.custom&&confirm(`Remove ${item.name} from your goals?`)){s.items=s.items.filter(v=>v.id!==id);if(s.featured===id)s.featured=s.items[0].id;persist();render();toast('Custom item removed.')}break;}
case 'featureGoal':s.featured=id;persist();render();toast('Your featured goal changed.');break;
case 'saveSettings':{const budget=validMoney($('#settingBudget').value);if(!budget){toast('Enter a valid monthly limit greater than zero.');break;}const old=s.profile.currency;s.profile.name=$('#settingName').value.trim().slice(0,35);s.profile.currency=$('#settingCurrency').value;s.profile.ageGroup=$('#settingAge').value;s.profile.gender=$('#settingGender').value;s.budget=budget;persist();render();toast(old===s.profile.currency?'Preferences updated.':'Currency label updated; amounts were not converted.');break;}
case 'saveCategoryBudgets':{for(const input of $$('.catBudget')){let n=Number(input.value);if(!Number.isFinite(n)||n<0||n>1000000){toast('Enter non-negative category limits.');return;}s.categoryBudgets[input.dataset.cat]=n;}persist();render();toast('Category limits saved.');break;}
case 'demo':if(confirm('Replace all transactions with sample data? Your preferences and budget will be kept. Export a backup first if you want to keep your current transactions.'))beginDemo();break;
case 'reset':if(confirm('Permanently delete ALL locally stored SAVE. data and restart? Export a backup first if needed.')){localStorage.removeItem(key);s=fresh();ui.month=nowmonth();closeModal();render();toast('Local data cleared.');}break;
case 'exportJson':exportJson();break;
case 'exportCsv':exportCsv();break;
case 'importCsv':filePicker('.csv,text/csv',async raw=>{importCsvText(raw)});break;
case 'importJson':filePicker('.json,application/json',async raw=>{const obj=JSON.parse(raw);if(!obj||!Array.isArray(obj.transactions)||!obj.profile||!obj.categoryBudgets)throw new Error('Not a compatible SAVE. backup.');if(!confirm('Restore this backup? Existing local data will be replaced.'))return;const data=fresh();const t=obj.transactions.filter(x=>x&&['expense','income','saving'].includes(x.type)&&/^\d{4}-\d{2}-\d{2}$/.test(x.date)&&validMoney(x.amount));s={...data,...obj,profile:{...data.profile,...obj.profile},categoryBudgets:{...data.categoryBudgets,...obj.categoryBudgets},transactions:t.map(x=>({...x,id:x.id||uid(),amount:Number(x.amount)})),items:Array.isArray(obj.items)&&obj.items.length?obj.items:data.items,onboarded:true};persist();ui.month=nowmonth();closeModal();navigate('dashboard');toast(`Restored ${t.length} records.`)});break;
default:break;
}
}catch(error){console.error(error);toast('Something went wrong: '+error.message)}
});
document.addEventListener('submit',ev=>{const form=ev.target;const formKind=form.getAttribute('id');if(!['transactionForm','benchmarkForm','priceForm','newItemForm'].includes(formKind))return;ev.preventDefault();const f=new FormData(form);
try{if(formKind==='transactionForm'){const amount=validMoney(f.get('amount')),date=String(f.get('date')),type=String(f.get('type')),category=String(f.get('category'));if(!amount||!/^\d{4}-\d{2}-\d{2}$/.test(date)||!['expense','income','saving'].includes(type))throw new Error('Please enter a valid amount, type, and date.');const existing=f.get('id')&&s.transactions.find(x=>x.id===f.get('id'));const entry={id:existing?.id||uid(),amount,date,type,category:type==='expense'?category:type==='income'?'Income':'Savings',merchant:String(f.get('merchant')||'').trim().slice(0,90),note:String(f.get('note')||'').trim().slice(0,400),recurring:!!f.get('recurring')};if(!entry.merchant)throw new Error('Please enter a merchant or description.');if(existing)Object.assign(existing,entry);else s.transactions.push(entry);ui.month=date.slice(0,7);persist();closeModal();render();toast(existing?'Record updated.':'New record added.');}
else if(formKind==='benchmarkForm'){const value=num(f.get('amount'));if(value<0||value>100000000||!Number.isFinite(value))throw new Error('Enter a valid benchmark.');s.benchmark={amount:value,label:String(f.get('label')||'').slice(0,85).trim(),source:String(f.get('source')||'').slice(0,180).trim()};persist();closeModal();render();toast('Reference benchmark updated.');}
else if(formKind==='newItemForm'){const price=validMoney(f.get('price'));const name=String(f.get('name')||'').trim().slice(0,70);if(!price||!name)throw new Error('Enter a name and a valid price.');const item={id:uid(),name,price,emoji:String(f.get('emoji')||'').trim().slice(0,4)||'🎁',custom:true};s.items.push(item);s.featured=item.id;persist();closeModal();render();toast('Custom goal added.');}
else if(formKind==='priceForm'){const item=s.items.find(x=>x.id===f.get('id'));const price=validMoney(f.get('price'));if(!item||!price)throw new Error('Enter a valid example price.');item.price=price;item.name=String(f.get('name')||'').trim().slice(0,70)||item.name;item.emoji=String(f.get('emoji')||'').trim().slice(0,4)||item.emoji;persist();closeModal();render();toast('Example item updated.');}}
catch(err){toast(err.message)}});
document.addEventListener('change',ev=>{const el=ev.target;if(el.id==='txType'){ui.filter=el.value;$('#ledgerRows').innerHTML=renderLedgerTable(activityFiltered())}if(el.id==='txCategory'){ui.category=el.value;$('#ledgerRows').innerHTML=renderLedgerTable(activityFiltered())}if(el.id==='aiMerchants'){ui.aiMerchant=el.checked;let preview=$('#promptPreview');if(preview)preview.textContent=makeAiPrompt(ui.aiMerchant)||'Not enough data.'}});
document.addEventListener('input',ev=>{if(ev.target.id==='txSearch'){ui.search=ev.target.value;$('#ledgerRows').innerHTML=renderLedgerTable(activityFiltered())}});
document.addEventListener('click',ev=>{if(ev.target.classList.contains('overlay')&&ev.target.dataset.overlay){if(ui.modal==='onboard')return;closeModal()}});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&ui.modal&&ui.modal!=='onboard')closeModal()});
render();
</script></body></html>
